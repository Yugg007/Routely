server:
  port: 8005
  servlet:
    context-path: /trips
  ssl:
    enabled: true
    key-store: file:/app/certs/keystore.p12
    key-store-password: routely123
    key-store-type: PKCS12
    key-alias: trip-service
    key-password: routely123
    trust-store: file:/app/certs/truststore.p12
    trust-store-password: routely123
    trust-store-type: PKCS12

spring:
  application:
    name: trip-service

  kafka:
    bootstrap-servers: routely-kafka:29092
    properties:
      security.protocol: PLAINTEXT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      client-id: trip-service-producer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: trip-service-group
      auto-offset-reset: earliest

  datasource:
    url: jdbc:mysql://mysql:3306/routely
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  instance:
    hostname: trip-service
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    
    # 🛡️ Secure Port Configs
    secure-port-enabled: true
    secure-port: 8005 # 💡 Updated to match server.port 8005
    non-secure-port-enabled: false
    
    # 🔗 Explicitly define HTTPS URLs
    home-page-url: https://${eureka.instance.hostname}:${server.port}/trips/
    status-page-url: https://${eureka.instance.hostname}:${server.port}/trips/actuator/info
    health-check-url: https://${eureka.instance.hostname}:${server.port}/trips/actuator/health
    
    metadata-map:
      secure: "true"
    
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-server:8761/eureka/
    
    tls:
      enabled: true
      trust-store: file:/app/certs/truststore.p12
      trust-store-password: routely123
      trust-store-type: PKCS12
      key-store: file:/app/certs/keystore.p12
      key-store-password: routely123
      key-store-type: PKCS12
      key-alias: trip-service

fare:
  base: 50
  perKm: 12
  perMinute: 2
  booking: 10
  minBookingCharge: 50
  maxBookingCharge: 300