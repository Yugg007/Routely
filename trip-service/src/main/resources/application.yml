server:
  port: 8005
  ssl:
    enabled: true
    key-store: classpath:routely.p12
    key-store-password: routely123
    key-store-type: PKCS12
    key-alias: routely
    key-password: routely123
    
    trust-store: classpath:truststore.p12
    trust-store-password: routely123
    trust-store-type: PKCS12

spring:
   application:
      name: trip-service

   kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      client-id: user-service-producer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: trip-service-group
      auto-offset-reset: earliest

   datasource:
      url: jdbc:mysql://127.0.0.1:3306/routely?useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: root
      password: root123
      driver-class-name: com.mysql.cj.jdbc.Driver

   jpa:
      hibernate:
         ddl-auto: update # Options: create, create-drop, validate, update
      properties:
         hibernate:
            dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
   instance:
      hostname: localhost
      secure-port-enabled: true
      secure-port: 8005
      non-secure-port-enabled: false
      prefer-ip-address: false
      instance-id: ${spring.application.name}:${server.port}
      secure-virtual-host-name: ${spring.application.name}
      home-page-url: https://${eureka.instance.hostname}:${server.port}/
      status-page-url: https://${eureka.instance.hostname}:${server.port}/actuator/info
      health-check-url: https://${eureka.instance.hostname}:${server.port}/actuator/health
      metadata-map:
         secure: true

   client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
         defaultZone: https://localhost:8761/eureka/
      jersey:
         enabled: true
      
      tls:
        enabled: true
        trust-store: classpath:truststore.p12
        trust-store-password: routely123
        trust-store-type: PKCS12
        key-store: classpath:routely.p12
        key-store-password: routely123
        key-store-type: PKCS12
        key-password: routely123
        key-alias: routely


fare:
   base: 50
   perKm: 12
   perMinute: 2
   booking: 10
   minBookingCharge: 50
   maxBookingCharge: 300