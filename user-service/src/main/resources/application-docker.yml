server:
  port: 8003
  servlet:
    context-path: /users
  ssl:
    enabled: true
    key-store: file:/app/certs/keystore.p12
    key-store-password: routely123
    key-store-type: PKCS12
    key-alias: user-service
    key-password: routely123
    trust-store: file:/app/certs/truststore.p12
    trust-store-password: routely123
    trust-store-type: PKCS12

spring:
  application:
    name: user-service
  kafka:
       bootstrap-servers: routely-kafka:29092
       properties:
            security.protocol: PLAINTEXT
       consumer:
            group-id: user-service-group
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            auto-offset-reset: earliest
       admin:
            client-id: user-service-admin
  datasource:
    url: jdbc:mysql://mysql:3306/routely
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Optional: create, create-drop, validate, update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
     redis:
       host: routely-redis
       port: 6379
eureka:
  instance:
    hostname: user-service
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    
    # 🛡️ Secure Port Configs
    secure-port-enabled: true
    secure-port: 8003
    non-secure-port-enabled: false
    
    # 🔗 Explicitly define HTTPS URLs so Gateway knows how to reach this service
    home-page-url: https://${eureka.instance.hostname}:${server.port}/
    status-page-url: https://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: https://${eureka.instance.hostname}:${server.port}/actuator/health
    
    metadata-map:
      secure: "true"
    
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-server:8761/eureka/
    
    tls:
      enabled: true
      trust-store: file:/app/certs/truststore.p12
      trust-store-password: routely123
      trust-store-type: PKCS12
      key-store: file:/app/certs/keystore.p12
      key-store-password: routely123
      key-store-type: PKCS12
      key-alias: user-service